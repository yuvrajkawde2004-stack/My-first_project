<!DOCTYPE html>
<html>
<head>
    <title>Vehicles</title>
    <style>
        body {
            font-family: Arial;
            background: #f8f8f8;
            padding: 20px;
        }
        form {
            background: white;
            padding: 20px;
            width: 400px;
            border-radius: 8px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: green;
            color: white;
            border: none;
        }
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<a href="/dashboard">Back to Dashboard</a>

<h2>Add Vehicle</h2>

<form method="POST">
    <input type="text" name="vehicle_name" placeholder="Vehicle Name" required>
    <input type="text" name="vehicle_number" placeholder="Vehicle Number" required>
    <input type="text" name="driver_name" placeholder="Driver Name" required>
    <input type="text" name="driver_mobile" placeholder="Driver Mobile" required>

    <select name="status">
        <option value="Available">Available</option>
        <option value="Booked">Booked</option>
    </select>

    <button type="submit">Save Vehicle</button>
</form>

<h2>Vehicle List</h2>

<table>
    <tr>
        <th>Vehicle</th>
        <th>Number</th>
        <th>Driver</th>
        <th>Mobile</th>
        <th>Status</th>
    </tr>

    {% for v in vehicles %}
    <tr>
        <td>{{ v.vehicle_name }}</td>
        <td>{{ v.vehicle_number }}</td>
        <td>{{ v.driver_name }}</td>
        <td>{{ v.driver_mobile }}</td>
        <td>{{ v.status }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
